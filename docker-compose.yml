# Local dev: one Hermes instance ("dev").
# Each Hermes container = one agent/tenant. Its whole state lives in one
# directory mounted at /opt/data, which maps 1:1 to a Fly Machine + Volume later.
#
#   cp .env.example .env   # fill in keys
#   docker compose up -d
#   curl localhost:8642/health
#
# Host networking (local dev only): lets Hermes reach Ollama on 127.0.0.1:11434
# without opening the host firewall. Everything binds to 127.0.0.1, so nothing
# is reachable from your LAN. On Fly, instances use normal private networking.

services:
  hermes-dev:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    container_name: hermes-dev
    restart: unless-stopped
    command: ["gateway", "run"]
    network_mode: host
    env_file: .env
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 127.0.0.1    # OpenAI-compatible API + /health on :8642
      API_SERVER_PORT: "8642"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 127.0.0.1   # built-in dashboard on :9119
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_API_TIMEOUT: "1800"    # local models are slow
    volumes:
      - ./data/instances/dev:/opt/data
    labels:
      platform.instance: dev
