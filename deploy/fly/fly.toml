# Template for one Hermes instance on Fly.io (one app or one Machine per tenant).
# Not used yet: later the control plane will create Machines via the Fly Machines API
# using these same settings.
#
#   fly apps create hermes-<tenant>
#   fly volumes create hermes_data --size 3 -a hermes-<tenant>
#   fly secrets set API_SERVER_KEY=... OPENROUTER_API_KEY=... -a hermes-<tenant>
#   fly deploy -c deploy/fly/fly.toml -a hermes-<tenant>

app = "hermes-CHANGEME"
primary_region = "iad"

[build]
  image = "nousresearch/hermes-agent:latest"

[experimental]
  cmd = ["gateway", "run"]

[env]
  API_SERVER_ENABLED = "true"
  API_SERVER_HOST = "0.0.0.0"
  API_SERVER_PORT = "8642"

[mounts]
  source = "hermes_data"
  destination = "/opt/data"

# Private only: reachable from your control plane over Fly's 6PN network
# (hermes-<tenant>.internal:8642), not from the internet.
[[services]]
  internal_port = 8642
  protocol = "tcp"
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[services.http_checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
